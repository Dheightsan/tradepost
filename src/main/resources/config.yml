# Tradepost configuration
# Text fields use MiniMessage: https://docs.advntr.dev/minimessage/format.html
# /shop reload applies everything in this file except the storage section, which needs a restart.

storage:
  # sqlite (a file in the plugin folder, nothing to set up) or mysql (also works with MariaDB)
  type: sqlite
  table-prefix: tradepost_
  sqlite:
    file: shop.db
  mysql:
    host: localhost
    port: 3306
    database: minecraft
    username: minecraft
    password: ""
    pool-size: 4
    connection-timeout-ms: 10000
    # Extra JDBC properties, passed to the driver as they are.
    properties:
      useSSL: false
      characterEncoding: utf8

# price moves by `step` per unit, items can override this or use dynamic: false
pricing:
  enabled: true
  step: 0.004
  min-multiplier: 0.5
  max-multiplier: 2.0
  recovery-half-life-minutes: 30

menu:
  title: "<dark_gray>Shop"
  rows: 3

# item ids must be unique. keep sell well below buy or ppl can loop trades for money
categories:
